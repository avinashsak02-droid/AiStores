name: Weekly AI Report

on:
  schedule:
    - cron: '0 7 * * 1' # Every Monday at 07:00 UTC
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab, for testing

permissions:
  contents: write

jobs:
  update-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Fetch weekly AI report
        run: node scripts/fetch-weekly-report.js

      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/weekly-report.json
          git diff --staged --quiet || git commit -m "chore: update weekly AI report"
          git push